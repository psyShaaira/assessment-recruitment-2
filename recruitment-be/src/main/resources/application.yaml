spring:
  application:
    name: recruitment
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recruitment}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: none
  mvc:
    problemdetails:
      enabled: true

jwt:
  secret: ${JWT_SECRET:change-this-in-production-must-be-at-least-32-chars}
  expiry-hours: ${JWT_EXPIRY_HOURS:1}

app:
  base-url: ${APP_BASE_URL:http://localhost:4200}

# Self-hosted Piston engine (docker run --privileged -p 2000:2000 ghcr.io/engineer-man/piston).
# The public API (emkc.org) is whitelist-only since 2026-02-15 and cannot be used anonymously.
piston:
  base-url: ${PISTON_BASE_URL:http://localhost:2000/api/v2}
  java-version: "*"
  connect-timeout: 3s
  read-timeout: 20s
  run-timeout-ms: 5000
  compile-timeout-ms: 10000
  min-interval-ms: 1100
  max-queue-wait-ms: 8000

ai:
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    temperature: ${GROQ_TEMPERATURE:0.7}
    timeout-seconds: ${GROQ_TIMEOUT_SECONDS:30}
