server:
  port: 8080
  error:
    include-message: always

spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  datasource:
    # 5433 = host-published port of the docker-compose db service
    url: jdbc:postgresql://localhost:5433/recruitment
    username: recruitment
    password: recruitment
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  mail:
    host: localhost
    port: 1025
  mvc:
    problemdetails:
      enabled: true

flagging:
  ai-enabled: true
